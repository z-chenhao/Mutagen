# Standalone experiment workspace.
#
# This crate deliberately does NOT join the production workspace
# (the empty `[workspace]` table below detaches it from the repository
# root workspace). It is disposable experiment infrastructure for
# Experiment 0006; none of it is a production API.
[package]
name = "mutagen-exp-0006"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
# Serialization for the OpenAI-compatible chat protocol and artifacts.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Synchronous HTTP client for the single model endpoint.
# Synchronous on purpose: Experiment 0006 tests semantics, not
# throughput; no async runtime (tokio) is introduced.
ureq = { version = "2", features = ["json"] }
# SHA-256 for prompt / task-suite provenance hashes.
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"
